<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Save to CloudKeep</title>
  </head>
  <body class="popup">
    <main>
      <header class="save-status">
        <h1 id="status" role="status">◌ Saving…</h1>
        <p id="page" class="page-title"></p>
        <p id="domain" class="muted"></p>
      </header>
      <section id="list-section" class="list-section" aria-labelledby="lists-heading">
        <h2 id="lists-heading">Lists</h2>
        <p class="muted hint">Tap to add or remove</p>
        <input
          id="filter"
          type="search"
          placeholder="Filter lists…"
          aria-label="Filter lists"
          hidden
        />
        <div id="lists"></div>
      </section>
      <p id="error" role="alert"></p>
      <footer>
        <button id="save" class="primary">Done</button>
        <div class="footer-links">
          <button id="undo" class="text-button" hidden>Undo</button>
          <a id="open" target="_blank" rel="noopener">Open CloudKeep ↗</a>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
