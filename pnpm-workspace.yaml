packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  workerd: true

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": ^5.20261016.1
  "@types/node": ^24
  "@void/vue": 1.1.11
  better-auth: ^1.7.10
  entities: 7.0.1
  esbuild: ^0.28.2
  hono: ^4.13.13
  miniflare: 5.20261012.0-beta
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vue: ^3.5.44
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
