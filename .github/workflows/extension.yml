name: Chrome Extension

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/extension/**"
      - "apps/web/lib/api.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/extension.yml"
  push:
    branches: [main, dev]
    tags: ["extension-v*"]
    paths:
      - "apps/extension/**"
      - "apps/web/lib/api.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp check && vp test && vp run extension#typecheck && vp run extension#build
      - name: Check release version and zip extension
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('apps/extension/package.json','utf8')).version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "extension-v$VERSION" ]]; then
            echo "::error::Tag version must match apps/extension/package.json ($VERSION)"
            exit 1
          fi
          cd apps/extension/dist
          zip -r "../../../cloudkeep-extension-$VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: cloudkeep-extension
          path: cloudkeep-extension-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/extension-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudkeep-extension
      - uses: softprops/action-gh-release@v2
        with:
          files: cloudkeep-extension-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
